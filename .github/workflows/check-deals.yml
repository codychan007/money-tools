# 每次改動資料或網頁，自動檢查資料格式同試行生成網站；有錯會喺 GitHub 顯示紅色 ❌。
name: Check data files

on:
  push:
    paths: ["data/deals.json", "data/insurance.json", "data/updates.json", "content/**", "scripts/build.py", "**/*.html"]
  pull_request:
    paths: ["data/deals.json", "data/insurance.json", "data/updates.json", "content/**", "scripts/build.py", "**/*.html"]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/validate_deals.py
      - run: python scripts/validate_insurance.py
      - run: python scripts/build.py
