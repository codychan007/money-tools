# 每次有人改動 data/deals.json 或 data/insurance.json，自動檢查格式；有錯會喺 GitHub 顯示紅色 ❌。
name: Check data files

on:
  push:
    paths: ["data/deals.json", "data/insurance.json"]
  pull_request:
    paths: ["data/deals.json", "data/insurance.json"]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/validate_deals.py
      - run: python scripts/validate_insurance.py
