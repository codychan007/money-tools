<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>My money check-up summary | HK Money Compass</title>
  <meta name="description" content="Your results from the money health check, salary split and goal planner on one page. The summary is created on your device only and never uploaded.">
  <meta name="theme-color" content="#F3ECDD">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main>
  <div class="wrap stack">
    <section class="hero">
      <div class="kicker"><span data-seal="檢"></span>Check-up summary</div>
      <h1>Your 3-step money check-up, all in one place</h1>
    </section>

    <div data-journey=""></div>

    <div id="report" class="stack"><div class="card center muted">Loading…</div></div>


    <p class="center hidden" id="clear-box" style="font-size:14px;color:var(--ink-2)"><button type="button" id="clear" class="link-btn">Erase my data</button> (deletes your results from all 3 steps on this device)</p>
    <p class="muted hidden" id="cleared">Erased.</p>

    <div class="disclaimer"><strong>Important:</strong> Results are for reference only and are not investment, insurance or financial advice.</div>
  </div>
</main>
<script type="module" src="/assets/js/checkup.js"></script>
