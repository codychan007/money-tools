<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>理財健康檢查：10 條問題睇清你嘅財務狀況｜香港地一站式理財資訊通</title>
  <meta name="description" content="10 條問題、2 分鐘，睇清你喺現金流、緊急備用金、負債、基本保障同增值習慣五方面嘅理財健康分數，附評分準則同改善建議。">
  <meta name="theme-color" content="#F3ECDD">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main>
  <div class="wrap stack">
    <section class="hero">
      <div class="kicker"><span data-seal="健"></span>理財體檢第 1 步・理財健康檢查</div>
      <h1>2 分鐘，幫你個荷包做個身體檢查</h1>
      <p>答完即刻睇到分數同 3 個最值得先做嘅改善位。</p>
    </section>

    <div data-journey="health"></div>

    <section class="card" id="quiz">
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>
      <p class="muted" id="q-count" style="font-size:13px;margin:8px 0 4px"></p>
      <h2 id="q-title"></h2>
      <p class="muted" id="q-hint" style="font-size:14px"></p>
      <div id="q-body"></div>
      <div class="q-nav">
        <button class="btn secondary" id="prev">上一題</button>
        <button class="btn" id="next">下一題</button>
      </div>
    </section>

    <section id="result" class="stack hidden">
      <div class="card center">
        <p class="muted mt0">你嘅理財健康分數</p>
        <div class="big-result" id="total"></div>
        <p id="grade" style="font-weight:700;margin:4px 0 0"></p>
      </div>
      <div class="card">
        <h2>各範疇評分</h2>
        <div class="chart-box"><canvas id="radar" aria-label="各範疇評分雷達圖"></canvas></div>
        <div id="bars"></div>
        <p class="mt0" style="font-size:14px;margin-top:10px"><a href="#score-how" id="score-how-link">點樣評分？</a></p>
      </div>
      <div class="card tint">
        <h2>分數最低嘅 3 個範疇，可以點做？</h2>
        <ol class="tips" id="tips"></ol>
        <p class="muted" style="font-size:13px;margin:8px 0 0">以上建議只係根據你答嘅 10 條題，你嘅實際情況可能仲有其他要考慮；內容唔涉及任何產品。</p>
      </div>
      <div id="next-step"></div>
      <div class="card">
        <h2>分享到 IG Story</h2>
        <p class="muted" style="font-size:14px">分享圖只會顯示分數，唔會顯示你嘅收入或者存款。</p>
        <button class="btn block" id="share-btn">生成分享圖</button>
        <div class="share-preview" id="share-preview"></div>
        <button class="btn secondary block" id="restart" style="margin-top:10px">重新做一次</button>
      </div>
      <div class="callout green" style="font-size:14px">評分準則係按一般常見嘅理財經驗法則訂出（例如備用金 6 個月、儲蓄率 20%），並非任何官方或行業標準。</div>
    </section>


    <!--FAQ-->

    <div data-disclaimer="tool"></div>
    <div data-cta></div>
  </div>
</main>
<script src="/assets/vendor/chart.umd.min.js"></script>
<script type="module" src="/assets/js/health.js"></script>
</body>
</html>
