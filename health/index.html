<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>理財健康檢查｜理財資訊通</title>
  <meta name="description" content="10 條問題，2 分鐘睇清你嘅理財健康：現金流、備用金、負債、保障、增值習慣。">
  <meta name="theme-color" content="#0F5C3F">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main>
  <div class="wrap stack">
    <section class="hero">
      <div class="kicker">🩺 理財健康檢查</div>
      <h1>2 分鐘，幫你個荷包做個身體檢查</h1>
      <p>10 條簡單問題，唔使好準，大約數就得。答完即刻睇到分數同 3 個最值得先做嘅改善位。</p>
    </section>

    <section class="card" id="quiz">
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>
      <p class="muted" id="q-count" style="font-size:13px;margin:8px 0 4px"></p>
      <h2 id="q-title"></h2>
      <p class="muted" id="q-hint" style="font-size:14px"></p>
      <div id="q-body"></div>
      <div class="q-nav">
        <button class="btn secondary" id="prev">上一題</button>
        <button class="btn" id="next">下一題</button>
      </div>
    </section>

    <section id="result" class="stack hidden">
      <div class="card center">
        <p class="muted mt0">你嘅理財健康分數</p>
        <div class="big-result" id="total"></div>
        <p id="grade" style="font-weight:700;margin:4px 0 0"></p>
      </div>
      <div class="card">
        <h2>各範疇評分</h2>
        <div class="chart-box"><canvas id="radar" aria-label="各範疇評分雷達圖"></canvas></div>
        <div id="bars"></div>
      </div>
      <div class="card tint">
        <h2>👉 最值得先做嘅 3 件事</h2>
        <ol class="tips" id="tips"></ol>
        <p class="muted" style="font-size:13px;margin:8px 0 0">以上係一般性建議，冇考慮你嘅全部個人情況，亦唔涉及任何產品。</p>
      </div>
      <div class="card">
        <h2>📲 分享到 IG Story</h2>
        <p class="muted" style="font-size:14px">分享圖只會顯示分數，唔會顯示你嘅收入或者存款。</p>
        <button class="btn block" id="share-btn">生成分享圖</button>
        <div class="share-preview" id="share-preview"></div>
        <button class="btn secondary block" id="restart" style="margin-top:10px">重新做一次</button>
      </div>
      <div class="callout green" style="font-size:14px">評分準則係按一般常見嘅理財經驗法則訂出（例如備用金 6 個月、儲蓄率 20%），並非任何官方或行業標準。</div>
    </section>

    <div data-disclaimer="tool"></div>
    <div data-cta></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module" src="/assets/js/health.js"></script>
</body>
</html>
