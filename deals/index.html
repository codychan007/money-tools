<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>優惠福利：信用卡回贈整理同政府福利檢查｜香港地一站式理財資訊通</title>
  <meta name="description" content="香港社會人嘅優惠同福利：每兩星期整理高回贈信用卡優惠；再用 12 條問題檢查你有冇錯過持續進修基金、職津、公屋、青年宿舍、交通補貼等政府福利，附官方連結。">
  <meta name="theme-color" content="#F3ECDD">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main>
  <div class="wrap stack">
    <section class="hero">
      <div class="kicker"><span data-seal="惠"></span>優惠福利</div>
      <h1>有咩著數，你仲未攞？</h1>
    </section>
    <div class="seg" role="tablist" aria-label="優惠福利">
      <button role="tab" id="tab-cards" aria-selected="true" aria-controls="panel-cards" data-tab="cards">信用卡優惠</button>
      <button role="tab" id="tab-benefits" aria-selected="false" aria-controls="panel-benefits" data-tab="benefits">福利檢查</button>
    </div>
    <div id="panel-benefits" role="tabpanel" aria-labelledby="tab-benefits" class="stack hidden">
      <section class="card wizard" id="benefit-box" aria-live="polite"><noscript>請開啟 JavaScript 先用到呢個工具。</noscript><p class="muted">載入中…</p></section>
      <div class="disclaimer">福利資料整理自政府及相關機構官方網頁，每 3 個月核對一次，並以官方最新公布為準。檢查結果只屬估算，不構成任何申請資格嘅保證。本網站與香港政府並無關連。</div>
      <div data-cta data-cta-topic="deals" hidden></div>
    </div>
    <div id="panel-cards" role="tabpanel" aria-labelledby="tab-cards" class="stack">
    <div class="callout" style="font-size:14px">
      <b>用卡前諗清楚：</b>高回贈通常有最低簽賬同上限，唔好為咗回贈使多咗；外幣簽賬另收手續費；卡數要每月全數還清。
      <span class="muted" style="display:block;font-size:12.5px;margin-top:6px">優惠以發卡機構最新條款為準。本網站唔係發卡機構，唔收推介費，亦唔構成申請任何信用卡嘅建議。借定唔借？還得到先好借！</span>
    </div>
    <div id="status"></div>
    <div class="chips" id="cats"></div>
    <div id="list" class="stack"></div>
    </div>
  </div>
</main>
<script type="module" src="/assets/js/deals.js"></script>
<script type="module" src="/assets/js/benefits.js"></script>
</body>
</html>
