<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我嘅理財體檢總結｜香港地一站式理財資訊通</title>
  <meta name="description" content="將理財健康檢查、月薪分配同目標計算 3 步嘅結果放埋一頁。總結只喺你部機度生成，唔會上傳。">
  <meta name="theme-color" content="#F3ECDD">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main>
  <div class="wrap stack">
    <section class="hero">
      <div class="kicker"><span data-seal="檢"></span>理財體檢總結</div>
      <h1>你嘅 3 步理財體檢，放埋一齊睇</h1>
      <p>以下數字只喺你部機度生成，我哋睇唔到，亦唔會上傳。想有人同你一齊睇，可以帶住呢頁同我傾。</p>
    </section>

    <div data-journey=""></div>

    <div id="report" class="stack"><div class="card center muted">載入中……</div></div>

    <div data-cta></div>

    <section class="card flat hidden" id="clear-box">
      <h2>清除我嘅資料</h2>
      <p class="muted">清除之後，3 步嘅結果會喺呢部機刪除，進度由頭開始。</p>
      <button class="btn secondary" id="clear">清除我嘅資料</button>
    </section>
    <p class="muted hidden" id="cleared">已經清除。</p>

    <div class="disclaimer"><strong>重要提示：</strong>總結只係根據你輸入嘅數字同一般理財經驗法則計出，僅供參考，不構成任何投資、保險或財務建議。所用回報率純屬假設，並非保證。</div>
  </div>
</main>
<script type="module" src="/assets/js/checkup.js"></script>
</body>
</html>
