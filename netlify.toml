# Netlify 設定（舊網址）
#  - 網站已經搬咗去 Cloudflare Pages：https://codychan813.pages.dev
#  - codychan813.netlify.app 全部網址 301 轉去新網址，舊連結同搜尋排名會帶過去
#  - 只有改咗呢個檔案先會喺 Netlify 重新部署，其他改動唔會再用 Netlify 額度
[build]
  command = ""
  publish = "."
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml"

[[redirects]]
  from = "/*"
  to = "https://codychan813.pages.dev/:splat"
  status = 301
  force = true
